version: '3.8'

services:
  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-bot-template
    restart: unless-stopped
    
    # Environment variables - customize these or use .env file
    environment:
      # Required: Set your bot token here or in .env file
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-your_bot_token_here}
      
      # Logging configuration
      - RUST_LOG=${RUST_LOG:-info}
      
      # Network configuration
      - BOT_WEBHOOK_URL=${BOT_WEBHOOK_URL:-}
      - BOT_PORT=${BOT_PORT:-8080}
      
      # Feature flags
      - AI_ENABLED=${AI_ENABLED:-false}
      
      # Add your custom environment variables here
      # - WEATHER_API_KEY=${WEATHER_API_KEY:-}
      # - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      # - DATABASE_URL=${DATABASE_URL:-}
    
    # Port mapping (only needed for webhook mode)
    ports:
      - "${BOT_PORT:-8080}:8080"
    
    # Volume mounts for persistent data (optional)
    volumes:
      # Uncomment if you need persistent storage
      # - ./data:/app/data
      # - ./logs:/app/logs
      pass
    
    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.25'
    
    # Health check
    healthcheck:
      test: ["CMD", "pgrep", "telegram-bot-template"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

